name: 01 - Building Blocks

on: push

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: say hello
              run: echo "Hello World !"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run: !
                echo "I Will Fail"
                exit 1
            - name: Say Goodbye
              run: echo "Good Bye !"

